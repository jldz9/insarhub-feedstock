{% set name = "insarhub" %}
{% set version = "0.4.2" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/i/insarhub/insarhub-{{ version }}.tar.gz
  sha256: 492223fb67cb91100a84fdd2c8c84d6ad89aa62551b41d068bd9171fa0a63c24

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  noarch: python
  entry_points:
    - insarhub = insarhub.cli.main:main
    - insarhub-app = insarhub.app.main:main

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=61.0
  run:
    - python >={{ python_min }}
    - gdal >=3.6
    - mintpy
    - asf_search
    - burst2safe
    - cdsapi
    - colorama
    - contextily
    - dask
    - dem_stitcher
    - h5py
    - hyp3_sdk
    - networkx
    - openpyxl
    - psutil
    - pyaps3
    - python-multipart
    - fastapi
    - pysolid
    - pygrib
    - uvicorn
    - rasterio >=1.3
    - sentineleof
    - numpy <2.0
    # Ceiling required by numpy <2.0, NOT optional: imagecodecs 2026.3.6+
    # declares numpy>=2.0 in its dist-info, so `pip check` in the test env
    # fails with "imagecodecs ... has requirement numpy>=2.0, but you have
    # numpy 1.26.4". 2026.1.1 is the last release that declares a bare
    # `numpy`. Nothing in InSARHub imports imagecodecs directly -- it is
    # pulled in transitively -- so do not drop this pin on that basis.
    - imagecodecs <=2026.1.1


test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - insarhub
  commands:
    - pip check
    - insarhub --version
    - insarhub-app --version
about:
  home: https://github.com/jldz9/InSARHub
  license: MIT
  license_file: LICENSE
  summary: "A modular Python framework for automated InSAR and time-series processing."
  doc_url: https://jldz9.github.io/InSARHub/


extra:
  recipe-maintainers:
    - jldz9